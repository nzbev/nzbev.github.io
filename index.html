<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#1d7a3a">
    <title>Kasse</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg">
    <!-- Gleiches Aussehen wie die neue Kasse (v3) -->
    <link rel="stylesheet" href="./v3/kasse.css">
    <script src="./pwa.js" data-status="event"></script>
    <style>
        a.pick-tile { display: flex; align-items: center; font-size: 26px; }
        /* Inhalt mittig: margin:auto im Flex-Container zentriert, schneidet aber
           auf kleinen Bildschirmen oben nichts ab (scrollt dann normal). */
        .pick { display: flex; flex-direction: column; }
        .center { margin: auto; width: 100%; max-width: 900px; }
        .center h2 { text-align: center; }
        .center .pick-grid { grid-template-columns: repeat(4, 1fr); }
        @media (max-width: 700px) { .center .pick-grid { grid-template-columns: repeat(2, 1fr); } }
        .tools { margin-top: 28px; text-align: center; font-size: 16px; }
        .tools a { color: var(--muted); }
    </style>
</head>
<body>
    <div id="app">
        <div class="hdr">
            <div class="hdr-title">Kasse</div>
            <button class="sync" id="sync" type="button"></button>
        </div>
        <div class="pick"><div class="center">
            <h2>Verein w&auml;hlen</h2>
            <!-- Kacheln kommen aus vereine.csv (Ordner;Name) -->
            <div class="pick-grid" id="clubs"></div>
            <div class="tools"><a href="./pruefen.html">Preis-Dateien pr&uuml;fen</a> &middot; <a href="./sumup.html">SumUp einrichten</a></div>
        </div></div>
    </div>
    <script src="./v3/preise.js"></script>
    <script>
        // Vereine aus vereine.csv
        KassePreise.loadClubs("./").then(function (res) {
            var box = document.getElementById("clubs");
            function esc(s) {
                return String(s).replace(/[&<>"']/g, function (c) {
                    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
                });
            }
            if (!res.clubs.length) {
                box.outerHTML = '<div class="errs"><b>\u26a0 Keine Vereine gefunden</b><ul>' + res.errors.map(function (e) {
                    return "<li><span>" + esc(e.where) + ":</span> " + esc(e.msg) + "</li>";
                }).join("") + "</ul></div>";
                return;
            }
            box.innerHTML = res.clubs.map(function (c) {
                return '<a class="pick-tile" href="./v3/kasse.html?verein=' + encodeURIComponent(c.id) + '">' + esc(c.name) + "</a>";
            }).join("");
        });

        // Sync-Stand aus pwa.js in der Kopfzeile anzeigen; antippen = neu laden.
        (function () {
            var el = document.getElementById("sync");
            function paint(s) {
                if (!s) return;
                el.className = "sync " + s.level;
                el.textContent = s.text;
            }
            paint(window.kasseSyncState);
            window.addEventListener("kasse-sync", function (e) { paint(e.detail); });
            el.onclick = function () { if (window.kasseSync) window.kasseSync(); };
        })();
    </script>
</body>
</html>
