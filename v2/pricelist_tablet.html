<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NZB Kasse</title>
  <script type="text/javascript" src="data.js"></script>
  <script type="text/javascript" src="calc.js"></script>
  <script type="text/javascript" src="kassiere.js"></script>
  <meta http-equiv="cache-control" content="no-cache" />
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 85vh;
      width: 100vw;
      margin: 0;
      background-color: #f4f4f4;
    }

    .form-container {
      display: grid;
      grid-template-columns: 4fr 1fr 1fr;
      gap: 10px;
      width: 100%;
      height: 100%;
      background: white;
      padding: 20px;
      box-sizing: border-box;
    }

    .form-group {
      display: contents;
    }

    .form-group button {
      padding: 8px;
      background: #AFE1AF;
      color: black;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 1.8em;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid #000;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1.8em;
      font-weight: bold;
    }

    /* Kassieren-Maske */
    .kassiere-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .kassiere-overlay.show {
      display: flex;
    }

    .kassiere-box {
      background: white;
      width: 96vw;
      height: 96vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    .kassiere-left {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .kassiere-right {
      /* Zahlenpad-Container, sizet sich am Inhalt */
    }

    .kassiere-box h2 {
      margin: 0 0 6px 0;
      font-size: 1.4em;
    }

    .kassiere-summary {
      width: 100%;
      border-collapse: collapse;
      font-size: 1.3em;
    }

    .kassiere-summary td {
      padding: 4px 8px;
      border-bottom: 1px solid #eee;
    }

    .kassiere-summary td.qty {
      width: 12%;
      text-align: right;
    }

    .kassiere-summary td.amt {
      text-align: right;
      width: 22%;
      font-weight: bold;
    }

    .kassiere-total {
      font-size: 2.6em;
      font-weight: bold;
      margin: 8px 0;
      text-align: right;
      border-top: 2px solid #333;
      padding-top: 6px;
    }

    .kassiere-quick {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin: 4px 0;
    }

    .kassiere-quick button {
      font-size: 1.2em;
      font-weight: bold;
      padding: 14px 4px;
      background: #AFE1AF;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .kassiere-erhalten {
      font-size: 2.6em;
      font-weight: bold;
      text-align: right;
      border: 2px solid #333;
      padding: 10px;
      background: #fffbeb;
    }

    .kassiere-rueck-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .kassiere-rueck {
      font-size: 3em;
      font-weight: bold;
      text-align: right;
      color: #2C7A4B;
      padding: 6px 8px;
    }

    .kassiere-rueck.neg {
      color: #c0392b;
    }

    .kassiere-stueck {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      font-size: 1.5em;
    }

    .kassiere-stueck .entry {
      display: flex;
      gap: 8px;
      padding: 2px 8px;
    }

    .kassiere-stueck .entry .n {
      text-align: right;
      font-weight: bold;
    }

    .kassiere-stueck .rest {
      grid-column: 1 / -1;
      font-style: italic;
      color: #888;
      padding: 2px 8px;
    }

    .kassiere-pad {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .kassiere-pad button {
      font-size: 1.4em;
      font-weight: bold;
      padding: 8px;
      border: 1px solid #ccc;
      background: #f4f4f4;
      border-radius: 4px;
      cursor: pointer;
    }

    .kassiere-footer .clear {
      background: #FF5733;
      color: white;
    }

    .kassiere-footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    .kassiere-footer button {
      font-size: 1.5em;
      font-weight: bold;
      padding: 14px 32px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      flex: 1;
    }

    .kassiere-footer .zurueck {
      background: #95a5a6;
      color: white;
    }

    .kassiere-footer .fertig {
      background: #2C7A4B;
      color: white;
    }

    #kassiere-open {
      width: 100%;
      padding: 12px;
      font-size: 1.8em;
      font-weight: bold;
      background: #2C7A4B;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <form class="form-container" name="Rechner" action="" onsubmit="return false;">
    <script type="text/javascript">
      var artcnt = 0
      for (const [artkey, artvalue] of Object.entries(config[event].locations[loc].articles)) {
        var art = Object.assign({}, defaultArticles, config[event].articles)
        var depoprice = 0
        if (art[artvalue].depo == "nix") {
          depoprice = 0
        } else {
          depoprice = config[event].depo[art[artvalue].depo].price
        }


        document.write(
          '<div class="form-group">',
          '<button type="button" name="B' + artcnt + '" value="' + artvalue + '" onclick="dazu(' + art[artvalue].price + ', this.name, \'' + art[artvalue].depo + '\',' + depoprice + ')">' + art[artvalue].name + '</button>' +
          '<input type="text" name="A' + artcnt + '" readonly>' +
          '<input type="text" name="S' + artcnt + '" readonly>' +
          '</div>'
        )
        artcnt += 1;
      }
      for (const [depokey, depovalue] of Object.entries(config[event].depo)) {
        document.write(
          '<div class="form-group">',
          '<button style="background:  #B2BEB5;" type="button" name="B' + artcnt + '" value="' + depovalue.name + '" id="' + depokey + '"">' + depovalue.name + '</button>' +
          '<input type="text" name="A' + artcnt + '" readonly>' +
          '<input type="text" name="S' + artcnt + '" readonly>' +
          '</div>'
        )
        artcnt += 1;
      }
      for (const [depokey, depovalue] of Object.entries(config[event].depo)) {
        document.write(
          '<div class="form-group">',
          '<button type="button" name="B' + artcnt + '" value="' + depovalue.name + ' ret" onclick="dazu(' + depovalue.price * -1 + ', this.name)">' + depovalue.name + ' zur</button>',
          '<input type="text" name="A' + artcnt + '" readonly>' +
          '<input type="text" name="S' + artcnt + '" readonly>' +
          '<tr>'
        )
        artcnt += 1;
      }
    </script>

    <div class="form-group">
      <div style="display: flex; gap: 10px;">
        <button style="background: #FF5733; flex: 1;" type="reset" value="L&ouml;schen">L&ouml;schen</button>
        <button id="kassiere-open" style="flex: 1;" type="button" onclick="kassiereOeffnen()">Kassieren</button>
      </div>
      <input type="text" placeholder="Sum">
      <input type="text" name="Summe" readonly>
    </div>

  </form>

  <div id="kassiere-overlay" class="kassiere-overlay">
    <div class="kassiere-box">
      <div class="kassiere-left">
        <div class="kassiere-total">Total: <span id="kassiere-total">0,00 €</span></div>

        <div class="kassiere-quick">
          <button type="button" onclick="kassiereSet('5')">5 €</button>
          <button type="button" onclick="kassiereSet('10')">10 €</button>
          <button type="button" onclick="kassiereSet('20')">20 €</button>
          <button type="button" onclick="kassiereSet('50')">50 €</button>
          <button type="button" onclick="kassiereSet('100')">100 €</button>
        </div>

        <div style="margin-top: 8px; font-size: 1.5em; font-weight: bold;">Erhalten:</div>
        <div class="kassiere-erhalten" id="kassiere-erhalten">0,00 €</div>

        <div style="margin-top: 8px; font-size: 1.5em; font-weight: bold;">R&uuml;ckgeld:</div>
        <div class="kassiere-rueck-row">
          <div class="kassiere-rueck" id="kassiere-rueck">&ndash;</div>
          <div class="kassiere-stueck" id="kassiere-stueck"></div>
        </div>
      </div>

      <div class="kassiere-right">
        <div class="kassiere-pad">
          <button type="button" onclick="padDigit('7')">7</button>
          <button type="button" onclick="padDigit('8')">8</button>
          <button type="button" onclick="padDigit('9')">9</button>
          <button type="button" onclick="padDigit('4')">4</button>
          <button type="button" onclick="padDigit('5')">5</button>
          <button type="button" onclick="padDigit('6')">6</button>
          <button type="button" onclick="padDigit('1')">1</button>
          <button type="button" onclick="padDigit('2')">2</button>
          <button type="button" onclick="padDigit('3')">3</button>
          <button type="button" onclick="padDigit('0')">0</button>
          <button type="button" onclick="padDigit(',')">,</button>
          <button type="button" onclick="padBack()">&#9003;</button>
        </div>
      </div>

      <div class="kassiere-footer">
        <button type="button" class="clear" onclick="padClear()">L&ouml;schen</button>
        <button type="button" class="zurueck" onclick="kassiereSchliessen()">Zur&uuml;ck</button>
        <button type="button" class="fertig" onclick="kassiereFertig()">Fertig</button>
      </div>
    </div>
  </div>
</body>

</html>
